services:
  - type: web
    name: bangalore-real-estate-scraper
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: GCP_SERVICE_ACCOUNT_KEY
        sync: false
      - key: GOOGLE_SHEET_NAME
        value: Bangalore Real Estate Projects Tracker
      - key: SEARCH_STRATEGY
        value: hybrid
      - key: CRON_SECRET
        generateValue: true
