name: Daily Bangalore Real Estate Scraper

on:
  # Daily automated trigger at 03:00 UTC (08:30 AM Indian Standard Time)
  schedule:
    - cron: '0 3 * * *'
  
  # Manual on-demand trigger button in GitHub Actions tab
  workflow_dispatch:
    inputs:
      search_strategy:
        description: 'AI Search Strategy (hybrid / gemini / perplexity)'
        required: false
        default: 'hybrid'

# The run publishes the map to GitHub Pages, which needs these three.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape-and-sync:
    name: Scrape Bangalore Projects & Sync to GSheet
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bangalore Real Estate Scraper & Sync
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME || 'Bangalore Real Estate Projects Tracker' }}
          SEARCH_STRATEGY: ${{ github.event.inputs.search_strategy || secrets.SEARCH_STRATEGY || 'hybrid' }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          # Geocoding. Backend is auto-detected from whichever key is present:
          # LocationIQ / Geoapify (free, no card) > Google (billable) > public Nominatim.
          GEOCODE_ENABLED: ${{ vars.GEOCODE_ENABLED || 'true' }}
          # Blank/0 means "use the chosen backend's own ceiling".
          GEOCODE_MAX_PER_RUN: ${{ vars.GEOCODE_MAX_PER_RUN || '0' }}
          GEOCODE_BACKEND: ${{ vars.GEOCODE_BACKEND }}
          LOCATIONIQ_API_KEY: ${{ secrets.LOCATIONIQ_API_KEY }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_PLACES_FALLBACK: ${{ vars.GOOGLE_PLACES_FALLBACK || 'true' }}
          # Sheet sharing: comma-separated Gmail / Workspace addresses.
          SHARE_WITH_EMAILS: ${{ secrets.SHARE_WITH_EMAILS }}
          SHARE_ROLE: ${{ vars.SHARE_ROLE || 'writer' }}
          SHARE_NOTIFY: ${{ vars.SHARE_NOTIFY || 'false' }}
        run: |
          python src/main.py

      - name: Upload Scraped JSON Backup Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bangalore-real-estate-snapshot-${{ github.run_id }}
          path: scraped_projects_latest.json
          retention-days: 14

      - name: Export located projects for the map
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME || 'Bangalore Real Estate Projects Tracker' }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python scripts/export_map_pins.py --out site/pins.geojson

      - name: Package the map for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishes site/ (the map page + pins.geojson) to the repo's GitHub Pages
  # URL after every run, so the map refreshes itself with no manual reimport.
  deploy-map:
    name: Deploy map to GitHub Pages
    needs: scrape-and-sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
